<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Socket.IO Real-Time Disaster Events Monitor</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #070d1a;
      color: #f1f5f9;
      padding: 24px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .connected { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .disconnected { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .card {
      background: #0e1628;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .event-card {
      background: #162035;
      border-left: 4px solid #3b82f6;
      border-radius: 6px;
      padding: 12px;
      font-size: 0.9rem;
    }
    .event-created { border-left-color: #ef4444; }
    .event-updated { border-left-color: #f59e0b; }
    pre {
      background: #070d1a;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🚨 Real-Time Disaster Events Monitor</h2>
      <span id="status" class="badge disconnected">Disconnected</span>
    </div>

    <div class="card">
      <label>Subscribe to Specific Disaster Room: </label>
      <input type="text" id="roomInput" placeholder="Enter Disaster UUID..." style="padding: 6px 10px; background: #070d1a; border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px; width: 300px;">
      <button onclick="joinRoom()" style="padding: 6px 14px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer;">Join Room</button>
      <div id="roomStatus" style="font-size: 0.8rem; color: #94a3b8; margin-top: 6px;">Global feed active</div>
    </div>

    <h3>Live Event Stream</h3>
    <div id="feed" class="feed">
      <div class="event-card">Waiting for live real-time disaster updates...</div>
    </div>
  </div>

  <script>
    const socket = io('http://localhost:3000');
    const statusEl = document.getElementById('status');
    const feedEl = document.getElementById('feed');
    const roomInput = document.getElementById('roomInput');
    const roomStatusEl = document.getElementById('roomStatus');

    socket.on('connect', () => {
      statusEl.textContent = `Connected (${socket.id})`;
      statusEl.className = 'badge connected';
    });

    socket.on('disconnect', () => {
      statusEl.textContent = 'Disconnected';
      statusEl.className = 'badge disconnected';
    });

    socket.on('disaster_created', (data) => {
      appendEvent('disaster_created', '🚨 New Disaster Created', data, 'event-created');
    });

    socket.on('disaster_updated', (data) => {
      appendEvent('disaster_updated', '⚠️ Disaster Status Updated', data, 'event-updated');
    });

    socket.on('disaster_deleted', (data) => {
      appendEvent('disaster_deleted', '🗑️ Disaster Incident Resolved/Deleted', data, 'event-card');
    });

    socket.on('report_added', (data) => {
      appendEvent('report_added', '📢 Community Report Added', data, 'event-card');
    });

    function joinRoom() {
      const id = roomInput.value.trim();
      if (id) {
        socket.emit('join:disaster', id);
        roomStatusEl.textContent = `Subscribed to room: disaster:${id}`;
      }
    }

    function appendEvent(type, title, data, className) {
      const card = document.createElement('div');
      card.className = `event-card ${className}`;
      card.innerHTML = `
        <strong>${title}</strong> <span style="float: right; color: #64748b; font-size: 0.75rem;">${new Date().toLocaleTimeString()}</span>
        <pre>${JSON.stringify(data, null, 2)}</pre>
      `;
      feedEl.prepend(card);
    }
  </script>
</body>
</html>
